<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fond dégradé sombre et pro -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Dégradé de la feuille / facture -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Éclair vif -->
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Ombre douce sous le document -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Fond arrondi pour l'icône d'application -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <g filter="url(#shadow)">
    <!-- Forme de la facture avec coin supérieur droit coupé -->
    <path d="M 144 88
             H 312 
             L 384 160 
             V 416 
             A 20 20 0 0 1 364 436 
             H 144 
             A 20 20 0 0 1 124 416 
             V 108 
             A 20 20 0 0 1 144 88 Z" 
          fill="url(#docGrad)" />

    <!-- Coin corné (plié) -->
    <path d="M 312 88 
             V 144 
             A 16 16 0 0 0 328 160 
             H 384 
             Z" 
          fill="#60a5fa" />

    <!-- Lignes de texte / montant de la facture -->
    <rect x="168" y="160" width="100" height="14" rx="7" fill="#93c5fd" opacity="0.8" />
    <rect x="168" y="196" width="176" height="14" rx="7" fill="#bfdbfe" opacity="0.4" />
    <rect x="168" y="376" width="176" height="18" rx="9" fill="#ffffff" opacity="0.9" />

    <!-- Éclair Facturix au premier plan (centré, pointes nettes) -->
    <path d="M 276 190 
             L 194 304 
             H 252 
             L 236 370 
             L 318 256 
             H 260 
             Z" 
          fill="url(#bolt)" />
  </g>
</svg>
